<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Detail</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/detail.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/embeddings.js"></script>
    <script type="module" src="js/pdf-extract.js"></script>
</head>
<body>

<div id="detail-layout">

    <!-- MAIN CONTENT -->
    <div id="detail-main">

        <!-- TOP BAR -->
        <div id="detail-topbar">
            <button class="back-btn" onclick="window.location.href='index.html'">
                ← Back to Graph
            </button>
        </div>

        <!-- HEADER -->
        <div id="detail-header">
            <div class="detail-type-badge" id="nodeTypeBadge"></div>
            <h1 id="nodeTitle">—</h1>
            <div id="aiSuggestedBadge"></div>
            <div id="nodeConnections" class="connections-list"></div>
        </div>

        <!-- ATTRIBUTES SECTION -->
        <div id="detail-content">
            <div class="section-header">
                <h2>Attributes</h2>
                <button class="primary" onclick="openAddAttributeForm()">+ Add Attribute</button>
            </div>

            <!-- ADD / EDIT FORM -->
            <div id="attributeForm" style="display:none;" class="attribute-form-card">
                <input type="hidden" id="editAttrId">
                <label>Attribute Type</label>
                <div class="type-selector-row">
                    <select id="attrTypeSelect"></select>
                    <button class="small-add-btn" onclick="toggleInlineAttrTypeForm()">+</button>
                </div>
                <div id="inlineAttrTypeForm" style="display:none; margin-top:10px;">
                    <label>New Attribute Type Name</label>
                    <input type="text" id="newAttrTypeName" placeholder="e.g. Summary, Source, Date">
                </div>
                <label>Value</label>
                <textarea id="attrValue" rows="4" placeholder="Enter description or value..."></textarea>
                <div class="btn-group" style="margin-top:12px;">
                    <button class="primary" onclick="handleSaveAttribute()">Save</button>
                    <button onclick="closeAttributeForm()">Cancel</button>
                </div>
            </div>

            <!-- ATTRIBUTE LIST -->
            <div id="attributeList"></div>
            <!-- PDF SOURCE DOCUMENTS -->
            <div id="pdfSection" style="margin-top:40px;">
                <div class="section-header">
                    <h2>Source Documents</h2>
                    <label class="pdf-upload-btn">
                        + Upload PDF
                        <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none;">
                    </label>
                </div>
                <div id="pdfUploadProgress" style="display:none;" class="pdf-progress"></div>
                <div id="pdfDocumentList"></div>
            </div>
            <!-- SIMILARITY SUGGESTIONS -->
            <div id="similaritySection" style="margin-top:40px;">
                <div class="section-header">
                    <h2>Suggested Connections</h2>
                    <button onclick="refreshSimilaritySuggestions()">🔄 Refresh</button>
                </div>
                <p class="panel-hint" style="margin-bottom:16px;">Based on semantic similarity between this node's attributes and others in the graph.</p>
                <div id="similarityResults"></div>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="detail-right-panel">
        <h3>Hover Card</h3>
        <p class="panel-hint">Select which attributes appear when hovering this node on the graph.</p>
        <div id="hoverCardList"></div>
    </div>

</div>

<script src="js/node_detail.js"></script>
</body>
</html>
